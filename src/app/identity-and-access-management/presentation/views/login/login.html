<main class="login-container">

  <!-- LEFT PANEL -->
  <section class="brand-panel">

    <header class="brand-header">
      <div class="brand-logo">
        <span class="logo-icon"></span>
        <span>Rumbo</span>
      </div>
    </header>

    <div class="decoration decoration-top">
      <span class="circle circle-one"></span>
      <span class="circle circle-two"></span>
    </div>

    <div class="brand-content">
      <h1>
        Tranquilidad<br>
        en cada<br>
        trayecto.
      </h1>
    </div>

    <div class="decoration decoration-bottom">
      <span class="bottom-ring"></span>
    </div>

    <footer class="brand-footer">
      Copyright © 2026 Rumbo. Todos los derechos reservados.
    </footer>

  </section>

  <!-- RIGHT PANEL -->
  <section class="form-panel">

    <button
      class="language-button"
      type="button"
      (click)="toggleLanguage()">

      <span>◎</span>
      {{ language }}
    </button>

    <div class="form-content">

      <div class="welcome-text">
        <span class="eyebrow">BIENVENIDO DE NUEVO</span>
        <h2>Inicia sesión en Rumbo</h2>
        <p>Elige tu rol para abrir la experiencia correspondiente.</p>
      </div>

      <!-- ROLE SELECTOR -->
      <div class="role-selector">

        <button
          type="button"
          class="role-option"
          [class.active]="selectedRole === 'tutor'"
          [attr.aria-pressed]="selectedRole === 'tutor'"
          (click)="selectRole('tutor')">

          <span class="role-dot"></span>
          Padres / Tutores
        </button>

        <button
          type="button"
          class="role-option"
          [class.active]="selectedRole === 'driver'"
          [attr.aria-pressed]="selectedRole === 'driver'"
          (click)="selectRole('driver')">

          <span class="role-dot"></span>
          Conductor
        </button>

      </div>

      <!-- LOGIN FORM: VISUAL ONLY -->
      <form class="login-form" (submit)="redirect()">

        <div class="form-group">
          <label for="email">Correo electrónico</label>

          <input
            id="email"
            type="email"
            placeholder="No se requiere credenciales todavia"
            autocomplete="off">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>

          <input
            id="password"
            type="password"
            placeholder="No se requiere credenciales todavia"
            autocomplete="off">
        </div>

        <div class="form-options">

          <label class="remember-option">
            <input type="checkbox">
            <span>Recordarme</span>
          </label>

          <button type="button" class="forgot-password">
            ¿Olvidaste tu contraseña?
          </button>

        </div>

        <button type="button" class="login-button" (click)="redirect()">
          Iniciar sesión
        </button>

      </form>

      <div class="register-text">
        ¿Nuevo en Rumbo?
        <button type="button">Crear una cuenta</button>
      </div>

    </div>

  </section>

</main>
