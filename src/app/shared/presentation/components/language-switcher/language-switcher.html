<button mat-stroked-button [matMenuTriggerFor]="langMenu" class="lang-btn" aria-label="Change language"><mat-icon>language</mat-icon> {{ currentLang === 'es-419' ? 'ES' : 'EN' }}</button><mat-menu #langMenu="matMenu">@for (language of languages; track language) {<button mat-menu-item [class.active-lang]="currentLang===language" (click)="useLanguage(language)"><span>{{ language==='es-419' ? 'Español (Latinoamérica)' : 'English' }}</span></button>}</mat-menu>
