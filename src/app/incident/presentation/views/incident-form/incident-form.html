<h2 mat-dialog-title class="modal-title">Reportar incidencia</h2><mat-dialog-content class="modal-content"><mat-form-field appearance="outline" class="full-width"><mat-label>Título</mat-label><input matInput [(ngModel)]="title" placeholder="Ej. Avería del vehículo"></mat-form-field><mat-form-field appearance="outline" class="full-width"><mat-label>Descripción</mat-label><textarea matInput rows="4" [(ngModel)]="message" placeholder="Describe brevemente lo ocurrido"></textarea></mat-form-field><mat-form-field appearance="outline" class="full-width"><mat-label>Prioridad</mat-label><mat-select [(ngModel)]="priority"><mat-option value="regular">Regular</mat-option><mat-option value="important">Importante</mat-option><mat-option value="critical">Crítica</mat-option></mat-select></mat-form-field></mat-dialog-content><mat-dialog-actions align="end"><button mat-button mat-dialog-close>Cancelar</button><button mat-flat-button color="primary" (click)="submit()" [disabled]="!title.trim() || !message.trim()">Guardar</button></mat-dialog-actions>
