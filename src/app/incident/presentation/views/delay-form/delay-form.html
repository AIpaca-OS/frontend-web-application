<h2 mat-dialog-title class="modal-title">Reportar retraso</h2><mat-dialog-content class="modal-content"><p class="modal-subtitle">Selecciona la magnitud estimada de la demora:</p><div class="magnitude-grid">@for (value of ['5 minutos','10 minutos','15+ minutos']; track value) {<button type="button" class="mag-btn" [class.selected]="magnitude===value" (click)="magnitude=value">{{ value }}</button>}</div><mat-form-field appearance="outline" class="full-width"><mat-label>Causa del retraso</mat-label><input matInput [(ngModel)]="cause" placeholder="Ej. Tráfico pesado"></mat-form-field></mat-dialog-content><mat-dialog-actions align="end"><button mat-button mat-dialog-close>Cancelar</button><button mat-flat-button color="primary" (click)="submit()" [disabled]="!cause.trim()">Confirmar y guardar</button></mat-dialog-actions>
