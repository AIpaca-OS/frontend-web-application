<section class="page">

  <article class="card">

    <h1>Editar perfil</h1>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="form"
    >

      <mat-form-field appearance="outline">
        <mat-label>Nombres</mat-label>
        <input matInput formControlName="firstName" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Apellidos</mat-label>
        <input matInput formControlName="lastName" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Teléfono</mat-label>
        <input matInput formControlName="phoneNumber" />
      </mat-form-field>

      <div class="actions">

        <button
          mat-button
          type="button"
          (click)="cancel()"
        >
          Cancelar
        </button>

        <button
          mat-flat-button
          type="submit"
          [disabled]="form.invalid"
        >
          Guardar cambios
        </button>

      </div>

    </form>

  </article>

</section>
