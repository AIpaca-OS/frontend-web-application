<section class="page">

  <article class="card">

    <h1>{{ 'profiles.form.title' | translate }}</h1>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="form"
    >

      <mat-form-field appearance="outline">
        <mat-label>{{ 'students.form.firstName' | translate }}</mat-label>
        <input matInput [value]="profile()?.firstName" readonly />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>{{ 'students.form.lastName' | translate }}</mat-label>
        <input matInput [value]="profile()?.lastName" readonly />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>{{ 'profiles.detail.phone' | translate }}</mat-label>
        <input matInput formControlName="phoneNumber" />
      </mat-form-field>

      <div class="actions">

        <button
          mat-button
          type="button"
          (click)="cancel()"
        >
          {{ 'common.cancel' | translate }}
        </button>

        <button
          mat-flat-button
          type="submit"
          [disabled]="form.invalid"
        >
          {{ 'common.saveChanges' | translate }}
        </button>

      </div>

    </form>

  </article>

</section>
