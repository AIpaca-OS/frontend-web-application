name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build -- --base-href /frontend-web-application/

      - name: Resolve Pages output
        id: site
        shell: bash
        run: |
          if [ -f "dist/Rumbo-frontend/browser/index.html" ]; then
            SITE_DIR="dist/Rumbo-frontend/browser"
          elif [ -f "dist/Rumbo-frontend/index.html" ]; then
            SITE_DIR="dist/Rumbo-frontend"
          else
            echo "Could not locate built index.html"
            find dist -maxdepth 4 -type f | sort
            exit 1
          fi
          cp "$SITE_DIR/index.html" "$SITE_DIR/404.html"
          echo "site_dir=$SITE_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.site.outputs.site_dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
